# Render Blueprint — deploys the FastAPI backend as a single web service.
# Docs: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> point it at this repo.

services:
  - type: web
    name: valorant-ai-companion-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard, never committed
      - key: RIOT_API_KEY
        sync: false # HenrikDev API key for now (see README) — set in dashboard
      - key: CLAUDE_MODEL
        value: claude-opus-4-8
      - key: CORS_ORIGINS
        sync: false # set to your Vercel frontend URL after the frontend deploy
      - key: ADMIN_TOKEN
        sync: false # set in the Render dashboard; unset disables /analytics/summary
      - key: DISCORD_WEBHOOK_URL
        sync: false # Discord webhook for backend error alerts; unset disables alerting
