# Pull-request CI. The same three jobs also run on push to main inside
# deploy.yml, where the deploy job declares `needs:` on them — that is what
# actually gates the deploy. This workflow exists so PRs get the identical
# signal before merge.
#
# Why lint at all: the class of bug that shipped to production undetected —
# mental.py called notify_error() without importing it, so the tilt-check error
# path raised NameError instead of its intended 502 — invisible until the
# failure it was written to handle actually happened. Error-handling code is
# the least-exercised code in any app. A linter reads it anyway.
name: Lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # F821 undefined-name is the one that would have caught the NameError.
      # F401 unused-import and F811 redefinition catch the adjacent mistakes
      # (an import removed while a call remains, a name shadowed by accident).
      - name: Undefined names, unused and redefined imports
        run: ruff check --select F821,F401,F811 backend/app
      # Everything else ruff finds is reported but does not block, so tidying
      # can happen gradually without a red pipeline blocking a security fix.
      - name: Full ruff report (non-blocking)
        run: ruff check backend/app || true

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-dev.txt deliberately omits chromadb; conftest.py stubs it,
      # so the suite runs in seconds instead of waiting on a large native build
      # for code these tests never execute.
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests
        run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
