# Production stack for the EC2 box (see DEPLOYMENT.md). Runs locally too:
#   WEB_PORT=8080 docker compose up --build     ->  http://localhost:8080
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ROOT_PATH: /api            # Caddy strips /api before proxying; keeps /api/docs working
      VAC_STATE_DIR: /app/state
    volumes:
      - state:/app/state         # SQLite (mental profiles + analytics) survives redeploys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  state:
