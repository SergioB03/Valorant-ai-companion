# Production stack for the EC2 box (see DEPLOYMENT.md). Runs locally too:
#   WEB_PORT=8080 docker compose up --build     ->  http://localhost:8080

# Docker's default json-file driver keeps every log line forever. On a 20 GB
# root volume that makes "the disk filled up" the most likely way this app dies
# unattended — and a full disk takes down the whole box, not just logging.
# 30 MB per service is plenty to debug a recent incident.
# (infra/disk-watch.sh, installed as a systemd timer by infra/deploy.sh, is the
# watchdog for the disk itself and for hung-but-alive containers: `restart:
# unless-stopped` only acts on process exit, never on healthcheck status.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ROOT_PATH: /api            # Caddy strips /api before proxying; keeps /api/docs working
      VAC_STATE_DIR: /app/state
    volumes:
      - state:/app/state         # SQLite (mental profiles + analytics) survives redeploys
    restart: unless-stopped
    logging: *default-logging
    # Bounded so one runaway container can't starve the t3.small (2 vCPU / 2 GB
    # + 2 GB swap). The API idles ~160 MB; 1 GB leaves headroom for Chroma +
    # concurrent Claude calls. Limits apply to the running container only —
    # image builds are unconstrained.
    mem_limit: 1g
    cpus: 1.5
    # Runs as uid 1000 (Dockerfile USER app) on a high port: needs no Linux
    # capabilities at all, and must never gain new privileges via setuid bits.
    # No read_only rootfs here: Chroma writes into /app/data/chroma_db and the
    # backup snapshot is staged in /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /health is the dependency-free liveness route (backend/app/routes/health.py)
      # — deliberately not "/" and not anything that touches HenrikDev/Anthropic,
      # so someone else's outage can't mark us unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    environment:
      # Shared secret CloudFront stamps on origin requests (X-Origin-Verify); Caddy
      # rejects anything without it. infra/deploy.sh writes it to ./.env on the box.
      # Empty (local dev) disables the check.
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    # Static files + reverse proxy: the rootfs has no reason to be writable.
    # Caddy's only writes go to /config and /data (autosave, storage), served
    # from tmpfs. Caddy stays container-root because it binds :80, so keep its
    # default capability set (it needs NET_BIND_SERVICE) — but no escalation.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp

volumes:
  state:
